name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  LLVM_VERSION: "22"
  QT_VERSION: "6.11.3"
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  QT_QPA_PLATFORM: offscreen
  QT_QUICK_BACKEND: software

jobs:
  quality:
    name: quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install qt ninja ccache libsndfile fluid-synth pkgconf "llvm@${LLVM_VERSION}"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 ninja-build ccache pkg-config libsndfile1-dev libfluidsynth-dev libasound2-dev \
            libgl1-mesa-dev libgl1-mesa-dri libegl1 libglx-mesa0 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0t64 fontconfig fonts-dejavu-core fonts-inter \
            "clang-format-${LLVM_VERSION}" "clang-tidy-${LLVM_VERSION}" \
            "libc++-${LLVM_VERSION}-dev" "libc++abi-${LLVM_VERSION}-dev"
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Install Qt
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qthttpserver qtwebsockets
          aqtversion: "==3.3.0"
          cache: true

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-

      - name: Restore fetched dependencies
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/*.patch') }}

      # A push lints the files it changed and the files that include a changed header; the nightly run lints every file.
      - name: Check format, lint and test
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ "${{ github.event_name }}" = schedule ] || [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            make quality-full
          else
            make quality BASE="$base"
          fi

      - name: Show the ccache hit rate
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-${{ github.sha }}

  service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Check format, lint, types and tests of the service
        run: make service-check

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Expose the cache token to docker build
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: docker-ccache
          key: docker-ccache-amd64-${{ github.sha }}
          restore-keys: docker-ccache-amd64-

      - name: Move ccache into the build
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: '{"docker-ccache": "/ccache"}'

      - name: Build the image and drive it over MCP
        run: make e2e
        env:
          DOCKER_BUILD_ARGS: --cache-from type=gha,scope=amd64 --cache-to type=gha,mode=max,scope=amd64

  image:
    if: github.event_name == 'push'
    needs: [quality, service, e2e]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Name the image in lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/emerick" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: docker-ccache
          key: docker-ccache-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: docker-ccache-${{ matrix.arch }}-

      - name: Move ccache into the build
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: '{"docker-ccache": "/ccache"}'

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: JOBS=4
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Name the image in lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/emerick" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Tag the multi-arch image
        working-directory: /tmp/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
