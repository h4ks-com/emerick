<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0">
  <title>Emerick Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1B1C20; font: 13px system-ui, sans-serif; }
    #screen { position: absolute; inset: 0; }
    #status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 8px 14px;
              border-radius: 10px; background: #25272D; color: #9599A3; pointer-events: none; z-index: 10; }
    #status:empty { display: none; }
    #status.corner { top: auto; bottom: 16px; transform: translateX(-50%); }
  </style>
</head>
<body>
  <!-- ?project=, ?mix= and ?bundle= name project.json, the rendered mix and the bundle folder the peak files sit in. -->
  <div id="screen"></div>
  <div id="status">Wait for the viewer to load</div>
  <audio id="mix" preload="auto" hidden></audio>
  <script src="emerick_viewer.js"></script>
  <script src="qtloader.js"></script>
  <script>
    const query = new URLSearchParams(location.search);
    const absolute = path => new URL(path, location.href).href;
    const project = absolute(query.get("project") ?? "project.json");
    const bundle = absolute(query.get("bundle") ?? new URL(".", project).href);
    const mix = absolute(query.get("mix") ?? "mix");
    const status = document.getElementById("status");
    let viewerReady = false;
    let mixState = "rendering";
    let failure = "";
    const showStatus = () => {
      status.classList.toggle("corner", viewerReady);
      status.textContent = failure ? failure
        : !viewerReady ? "Wait for the viewer to load"
        : mixState === "rendering" ? "Wait for the mix to render"
        : mixState === "failed" ? "Reload the page to load the mix" : "";
    };
    const fail = message => { failure = message; showStatus(); };
    window.emerickLoadError = error => fail("Check the project file: " + error);

    // The service answers 202 with Retry-After while it renders the mix, so we ask again until it is there.
    async function waitForMix() {
      for (;;) {
        const response = await fetch(mix, {headers: {Range: "bytes=0-0"}}).catch(() => null);
        if (response && response.status !== 202) {
          mixState = response.ok ? "ready" : "failed";
          if (response.ok) {
            document.getElementById("mix").src = mix;
          }
          return;
        }
        const seconds = Number(response?.headers.get("Retry-After")) || 2;
        await new Promise(resolve => setTimeout(resolve, seconds * 1000));
      }
    }
    waitForMix().then(showStatus);

    qtLoad({
      arguments: [project, "--bundle", bundle],
      qt: {
        entryFunction: window.emerick_viewer_entry,
        containerElements: [document.getElementById("screen")],
        onLoaded: () => { viewerReady = true; showStatus(); },
        onExit: () => fail("Reload the page to restart the viewer"),
      },
    }).catch(() => fail("Reload the page to load the viewer"));
  </script>
</body>
</html>
