apiVersion: apps/v1
kind: Deployment
metadata:
  name: emerick
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: emerick
  template:
    metadata:
      labels:
        app: emerick
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: emerick
          image: ghcr.io/OWNER/emerick:latest
          ports:
            - containerPort: 8080
          env:
            - name: EMERICK_MAX_SESSIONS
              value: "4"
            - name: EMERICK_SESSION_MEMORY_MB
              value: "1536"
            - name: EMERICK_PROJECT_MAX_MB
              value: "2048"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "4"
              memory: 7Gi
              ephemeral-storage: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: emerick-data
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: emerick-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: emerick
spec:
  selector:
    app: emerick
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: emerick
spec:
  podSelector:
    matchLabels:
      app: emerick
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: auth-proxy
      ports:
        - port: 8080
  egress: []
