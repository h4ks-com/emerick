name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: "22"
  QT_VERSION: "6.11.3"
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
  QT_QPA_PLATFORM: offscreen
  QT_QUICK_BACKEND: software

jobs:
  quality:
    name: quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install qt ninja ccache libsndfile pkgconf "llvm@${LLVM_VERSION}"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 ninja-build ccache pkg-config libsndfile1-dev libasound2-dev \
            libgl1-mesa-dev libgl1-mesa-dri libegl1 libglx-mesa0 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0t64 fontconfig fonts-dejavu-core fonts-inter \
            "clang-format-${LLVM_VERSION}" "clang-tidy-${LLVM_VERSION}" \
            "libc++-${LLVM_VERSION}-dev" "libc++abi-${LLVM_VERSION}-dev"
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Install Qt
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qthttpserver qtwebsockets
          aqtversion: "==3.3.0"
          cache: true

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-

      - name: Restore fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Check format, lint and test
        run: make quality

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: docker-ccache
          key: docker-ccache-${{ github.sha }}
          restore-keys: docker-ccache-

      - name: Move ccache into the build
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: '{"docker-ccache": "/ccache"}'

      - name: Build the headless image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: emerick-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Drive the headless app over MCP
        run: ./e2e/run.sh
